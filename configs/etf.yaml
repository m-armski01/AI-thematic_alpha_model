# Point-in-time ETF universe (brief v2). Identical to configs/base.yaml (the 12-stock basket)
# in every chosen turnover and gate setting, window, costs, base currency and top_n; it differs
# only in run.name, the universe file, the benchmark list, the selection framing, and the
# event-mask flag (off: ETFs report no earnings).
run:
  name: "etf"
  seed: 42
  start_date: "2015-01-01"
  end_date: "2026-09-11"      # pinned data snapshot (null = today); see README "Reproduction"
  base_currency: "EUR"        # EUR | USD

data:
  max_cache_age_days: 30      # the snapshot above is served from the cache; --refresh re-downloads
  min_history_days: 252       # exclude ticker if trailing history < this
  history_start: "1998-01-01" # download start; run.start_date is the backtest start
  suspicious_return_threshold: 0.25   # |1d return| above this is flagged in data_quality.md
  macro_publication_lag_days: 1       # FRED obs at t become usable at t+1 session
  min_dollar_volume_21d: 5000000      # liquidity screen: 21d ADV >= 5M base ccy (L1: 0 = off)

universe:
  file: "data/reference/universe_etf.csv"
  benchmarks: ["SPY"]         # [0] is the market: beta, features, S&P B&H
  selection: "point_in_time"  # hindsight | point_in_time (report framing)

features:
  momentum_windows: [21, 63, 126, 252]
  vol_windows: [21, 63]
  ma_windows: [50, 200]
  skip_recent_days: 5         # momentum computed skipping last 5d (reversal control)

macro_gate:
  enabled: true
  vix_threshold: 25.0         # engage above this
  vix_release_threshold: 20.0 # Schmitt trigger: release at or below this (L1: null = engage)
  vix_scale_factor: 0.5
  yield_change_window: 21
  yield_change_threshold: 0.40   # +40bps in 21d => engage
  yield_release_threshold: 0.32  # release at or below +32bp (0.8 x engage; L1: null)
  yield_scale_factor: 0.7
  oil_change_window: 21
  oil_change_threshold: 0.20     # +20% in 21d => engage
  oil_release_threshold: 0.16    # release at or below +16% (0.8 x engage; L1: null)
  oil_scale_factor: 0.85
  min_exposure: 0.30             # floor: never fully de-risk (unused in block mode)
  combination: "multiplicative"  # multiplicative | min | average
  action: "block_increases"      # scale | block_increases (L1: scale)
  block_exempt_segments: ["defensive"]   # TLT and GLD trade freely while risk-off
  evaluation: "monthly"          # weekly | monthly: gate sampled on the last signal date of each month (L1: weekly)

ranker:
  method: "momentum_zscore"      # momentum_zscore | equal_weight
  top_n: 5
  exit_rank: 8                   # rank buffer: enter at <= top_n, exit below this (L1: null = top_n)
  weighting: "equal"             # equal | inverse_vol | conviction_tier | softmax (L1: conviction_tier)
  conviction_tiers: [0.30, 0.25, 0.20, 0.15, 0.10]
  softmax_temperature: 1.0       # only used by weighting: softmax (sensitivity set: 0.5, 1, 2)

event_mask:
  enabled: false                 # ETFs report no earnings; the mask has nothing to mask
  file: "data/reference/earnings_dates.csv"
  block_days_before_earnings: 3
  block_new_entries_only: true   # true = don't add; existing positions untouched

sizing:
  max_position_weight: 0.35
  cash_floor: 0.0

turnover:
  position_band: 0.02            # skip held->held trades within 2pp of the drifted weight (L1: 0.0)

backtest:
  rebalance: "weekly"            # weekly | monthly
  rebalance_day: "friday"
  execution_lag_days: 1          # signal at t, execute at t+1
  execution_price: "open"        # open | close
  initial_capital: 10000.0
  cash_earns_rf: true            # idle cash accrues DTB3 (calendar-day basis), all runs (L1: false)

costs:
  model: "bps"                   # bps | flat_fee | both
  bps_per_side: 5.0
  flat_fee: 1.0                  # EUR, Trade Republic-style
  slippage_bps: 3.0

risk:
  rf_series: "DTB3"
  var_confidence: [0.95, 0.99]
  rolling_beta_window: 60
