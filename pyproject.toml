[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thematic-alpha"
version = "1.0.0"
description = "Research study: does a macro-gated momentum overlay beat buy-and-hold of a 12-stock AI basket?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas==2.2.2",
    "numpy==1.26.4",
    "yfinance==1.7.0",
    "exchange_calendars==4.13.2",
    "pyarrow==16.1.0",
    "PyYAML==6.0.1",
    "pydantic==2.7.4",
    "matplotlib==3.9.0",
]

[project.optional-dependencies]
dev = ["pytest==8.2.2", "ruff==0.4.9", "black==24.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # matplotlib 3.9 still calls pyparsing's camelCase API; not ours to fix.
    "ignore:.*deprecated - use.*:DeprecationWarning",
]
